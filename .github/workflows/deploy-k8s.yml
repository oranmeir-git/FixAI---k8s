name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/configmaps/ --recursive
          kubectl apply -f k8s/mysql/
          kubectl apply -f k8s/flask-app/
          kubectl apply -f k8s/nginx/
          kubectl apply -f k8s/prometheus/
          kubectl apply -f k8s/grafana/

      - name: Update Flask app image
        run: |
          kubectl set image deployment/flask-app \
            flask-app=${{ secrets.DOCKER_HUB_USERNAME }}/fixai-app:${{ github.event.workflow_run.head_sha }} \
            -n fixai

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/flask-app -n fixai --timeout=120s

      - name: Verify deployments
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n fixai
          echo "=== Service Status ==="
          kubectl get svc -n fixai
