apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: fixai
  labels:
    app.kubernetes.io/part-of: fixai
    app.kubernetes.io/component: monitoring
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: Prometheus
        isDefault: true
