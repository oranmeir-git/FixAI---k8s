apiVersion: batch/v1
kind: Job
metadata:
  name: fixai-integration-test
  namespace: fixai
  labels:
    app.kubernetes.io/name: integration-test
    app.kubernetes.io/part-of: fixai
    app.kubernetes.io/component: testing
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: integration-test
    spec:
      containers:
        - name: testserver
          image: oranmeir/fixai-test:latest
          env:
            - name: BASE_URL
              value: "http://flask-app:5000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Never
