apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: fixai
  labels:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/part-of: fixai
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-app
        app.kubernetes.io/part-of: fixai
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: flask-app
          image: oranmeir/fixai-app:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_NAME
              value: "flask"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: fixai-secrets
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixai-secrets
                  key: MYSQL_PASSWORD
            - name: GEMINI_KEY
              valueFrom:
                secretKeyRef:
                  name: fixai-secrets
                  key: GEMINI_KEY
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
